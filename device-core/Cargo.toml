[package]
name = "device-core"
description = "The platform's device contracts as pure logic: provisioning wire format, CSR, the platform shadow, publish limiter, backoff, serial console protocol, frozen NVS layouts. No esp-idf, no I/O; tested on the host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
