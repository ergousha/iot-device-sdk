[package]
name = "device-sdk"
description = "ESP-IDF side of the platform device contract: enrolment with a CSR (ATECC608B or NVS soft key), MQTT with a publish limiter and refusal backoff, signed and monotonic OTA through AWS IoT Jobs, the platform shadow, and bench provisioning over the serial console."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Exactly one key storage, matching `key_storage` in the product's
# platform.toml:
#
#   atecc608      the device key is slot 0 of an ATECC608B. The product must
#                 declare esp-cryptoauthlib with `bindings_module = "atca"`
#                 (see README) and link with -Wl,--wrap=atcab_release.
#   nvs-soft-key  a P-256 key generated on the device and kept in NVS.
#
# signed-only: refuse every OTA job without a signed manifest (Phase 6).
[features]
atecc608 = []
nvs-soft-key = []
signed-only = []

[dependencies]
device-core = { path = "../device-core" }
iot-jobs = { path = "../iot-jobs" }
esp-idf-svc = "0.52.1"
embedded-svc = "0.29"
anyhow = "1"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# The soft key: generation, CSR signing, PKCS#8 for esp-tls. iot-jobs links it
# for manifest verification already.
p256.workspace = true
