[package]
name = "iot-jobs"
version = "0.4.0"
description = "AWS IoT Jobs firmware-update protocol for the platform's devices: job documents, signed manifests, monotonic versions, outcome settling across the reboot, and the host-testable Jobs state machine. No I/O; on the device it verifies signatures with ESP-IDF's mbedTLS."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
sha2.workspace = true
base64.workspace = true

# Manifest signatures: ECDSA P-256 verification. On the device, mbedTLS
# through esp-idf-sys (ESP-IDF links it for TLS already); on the host, the
# pure-Rust p256, so the tests and test vectors run there. esp-idf-sys comes
# without default features: the product's esp-idf-svc picks them.
[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-sys = { version = "0.37", default-features = false }

[target.'cfg(not(target_os = "espidf"))'.dependencies]
p256.workspace = true

[dev-dependencies]
p256.workspace = true
